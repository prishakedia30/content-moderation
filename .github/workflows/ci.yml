# CI/CD: test -> build -> security scan (Trivy) -> push images to GHCR -> (optional) deploy.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: |
          pip install -r services/text-worker/requirements.txt -r services/ingest/requirements.txt \
                      -r services/video-worker/requirements.txt pytest fakeredis onnx==1.17.0
      # Each service is tested in its own run: they all have a module called app.py.
      - name: Test text-worker
        run: python -m pytest -q services/text-worker/tests
      - name: Test ingest
        run: python -m pytest -q services/ingest/tests
      - name: Test video-worker
        run: python -m pytest -q services/video-worker/tests
      - uses: azure/setup-helm@v4
      - name: Lint and render the Helm chart
        run: |
          helm lint deploy/helm/moderation
          helm template moderation deploy/helm/moderation --set image.tag=test > /dev/null

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingest, text-worker, video-worker, review-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "0"   # report only; set to "1" to block images with fixable CRITICAL/HIGH issues
      - name: Push
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Optional automatic deploy. Off until you set repository variable AUTO_DEPLOY=true and the
  # secrets SERVER_IP, SSH_PRIVATE_KEY, KUBECONFIG_B64, PG_PASSWORD (see RUNBOOK.md, step 9).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Open SSH tunnel to the cluster
        run: |
          mkdir -p ~/.ssh ~/.kube
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id && chmod 600 ~/.ssh/id
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -f -N \
              -L 6443:localhost:6443 ubuntu@${{ secrets.SERVER_IP }}
      - name: Helm upgrade (rolls back automatically if pods don't become ready)
        run: |
          helm upgrade --install moderation deploy/helm/moderation --atomic --timeout 8m \
            --set image.tag=${{ github.sha }} --set postgres.password='${{ secrets.PG_PASSWORD }}'
          kubectl get pods
