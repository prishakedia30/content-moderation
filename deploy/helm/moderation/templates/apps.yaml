{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  {{- if not (dig "hpa" "enabled" false $app) }}
  replicas: {{ $app.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $app.image | default (printf "%s/%s:%s" $.Values.image.registry $name (toString $.Values.image.tag)) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
            - name: DATABASE_URL
              value: "postgresql://moderation:$(PG_PASSWORD)@postgres:5432/moderation"
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $app.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: {{ $app.readyPath | default "/ready" }}, port: http }
            periodSeconds: 5
            failureThreshold: {{ div ($app.startupSeconds | default 60) 5 }}
          readinessProbe:
            httpGet: { path: {{ $app.readyPath | default "/ready" }}, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $app.healthPath | default "/health" }}, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml $app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  selector: { app: {{ $name }} }
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
{{- end }}
