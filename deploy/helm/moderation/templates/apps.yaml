{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app: {{ $name }} }
spec:
  {{- if not (dig "hpa" "enabled" false $app) }}
  replicas: {{ $app.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $app.image }}
          ports:
            - containerPort: {{ $app.port }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
            - name: DATABASE_URL
              value: "postgresql://moderation:$(PG_PASSWORD)@postgres:5432/moderation"
            {{- range $k, $v := $.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ $app.readyPath | default "/ready" }}, port: {{ $app.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ $app.healthPath | default "/health" }}, port: {{ $app.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector: { app: {{ $name }} }
  ports:
    - port: {{ $app.port }}
      targetPort: {{ $app.port }}
{{- end }}
