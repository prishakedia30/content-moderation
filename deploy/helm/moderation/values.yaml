# Shared settings every app receives as environment variables
env:
  REDIS_URL: redis://redis:6379/0
  S3_BUCKET: sap-moderation-858082489486
  AWS_REGION: ap-southeast-2
  MODEL_VERSION: v0

postgres:
  password: change-me   # overridden at install time, never commit the real one

# Placeholder images for now; swap in ghcr.io/<repo>/<app>:<tag> as teammates ship
apps:
  ingest:
    image: traefik/whoami
    port: 80
    healthPath: /
    readyPath: /
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  text-worker:
    image: traefik/whoami
    port: 80
    healthPath: /
    readyPath: /
    hpa: { enabled: true, minReplicas: 1, maxReplicas: 4, cpu: 60 }
    resources:
      requests: { cpu: 250m, memory: 128Mi }
      limits: { cpu: "1", memory: 1Gi }
  video-worker:
    image: traefik/whoami
    port: 80
    healthPath: /
    readyPath: /
    resources:
      requests: { cpu: 250m, memory: 128Mi }
      limits: { cpu: "2", memory: 3Gi }
  review-ui:
    image: traefik/whoami
    port: 80
    healthPath: /
    readyPath: /
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }
